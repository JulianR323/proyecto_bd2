<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contactanos</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="contacto.css" />
</head>

<body>
  <header class="navbar">
    <div class="contenedor nav-contenido">
      <a href="index.html" class="logo"> Mi<strong>Tienda</strong></a>
      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="index.html#productos">Productos</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>
  <main class="contenedor contenido-contacto">
    <div class="encabezado-principal">
      <h1>Contacto</h1>
      <p>Escríbenos si tienes alguna pregunta.</p>
    </div>

    <section class="tarjeta tarjeta-contacto">
      <h2>Envíanos un mensaje</h2>

      <form id="formularioContacto">
        <div class="campo">
          <label for="nombreContacto">Nombre:</label>
          <input type="text" id="nombreContacto" placeholder="Tu nombre" required />
        </div>

        <div class="campo">
          <label for="correoContacto">Correo electrónico:</label>
          <input type="email" id="correoContacto" placeholder="tu@correo.com" required />
        </div>

        <div class="campo">
          <label for="asuntoContacto">Asunto:</label>
          <input type="text" id="asuntoContacto" placeholder="Asunto del mensaje" required />
        </div>

        <div class="campo">
          <label for="mensajeContacto">Mensaje:</label>
          <textarea id="mensajeContacto" rows="5" placeholder="Escribe tu mensaje" required></textarea>
        </div>

        <button type="submit" class="btn btn-contacto">Enviar mensaje</button>
      </form>
    </section>
  </main>
  <footer class="footer">
    <div class="contenedor footer-contenido">
      <p>&copy; 2026 Tienda de Electronica</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>

</html>
